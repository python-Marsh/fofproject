[project]
name = "fofproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.3.2,<3.0.0)",
    "plotly (>=5.18.0,<6.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "pyfonts (>=1.1.1,<2.0.0)",
    "notebook (>=7.4.5,<8.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "jupyterlab (>=4.4.7,<5.0.0)",
    "openai (>=2.9.0,<3)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pymupdf (>=1.26.4,<2.0.0)",
    "yfinance (>=0.2.66,<0.3.0)",
    "pyportfolioopt (>=1.5.6,<2.0.0)",
    "kaleido (==0.2.1)",
    "selenium (>=4.36.0,<5.0.0)",
    "webdriver-manager (>=4.0.2,<5.0.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "plyer (>=2.1.0,<3.0.0)",
    "msal (>=1.34.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "openai-agents (>=0.8.1,<0.9.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "fpdf2 (>=2.8.6,<3.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
]

[tool.poetry]
packages = [{include = "fofproject", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
ruff = "^0.14.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
