version: "3.8"

services:
  # ── Python backend: FastAPI web API ──────────────────────
  backend:
    build: .
    command: uvicorn web.backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ${DATA_ROOT:-/mnt/data}/Input:/data/Input
      - ${DATA_ROOT:-/mnt/data}/output:/data/output
      - ${DATA_ROOT:-/mnt/data}/Hedge Funds:/data/Hedge Funds
      - ${DATA_ROOT:-/mnt/data}/RDGFF Emails:/data/RDGFF Emails
    ports:
      - "8000:8000"
    env_file: src/fofproject/.env
    environment:
      - MPLBACKEND=Agg
    restart: unless-stopped

  # ── Monitor: email classify, performance, notion sync ────
  monitor:
    build: .
    command: python monitor.py
    volumes:
      - ${DATA_ROOT:-/mnt/data}/Input:/data/Input
      - ${DATA_ROOT:-/mnt/data}/output:/data/output
      - ${DATA_ROOT:-/mnt/data}/Hedge Funds:/data/Hedge Funds
      - ${DATA_ROOT:-/mnt/data}/RDGFF Emails:/data/RDGFF Emails
    env_file: src/fofproject/.env
    environment:
      - MPLBACKEND=Agg
    restart: unless-stopped

  # ── Frontend: nginx serving React build ──────────────────
  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Cloudflare Tunnel: public access ────────────────────
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run
    env_file: src/fofproject/.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - frontend
    restart: unless-stopped
